name: CI

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for manual release (e.g., v1.0.0)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2
      with:
        platforms: linux/arm/v7

    - name: Build for ARM on Debian Jessie
      run: |
        docker run --rm --platform linux/arm/v7 -v ${{ github.workspace }}:/workspace -w /workspace arm32v7/debian:jessie bash -c "
          cat << 'EOF' > /etc/apt/sources.list
          deb http://archive.debian.org/debian jessie main
          deb http://archive.debian.org/debian-security jessie/updates main
          EOF
          echo 'Acquire::Check-Valid-Until \"false\";' > /etc/apt/apt.conf.d/99no-check-valid-until && \
          apt-get update -o Acquire::Check-Valid-Until=false || true && \
          apt-get install -y --force-yes \
            git \
            build-essential \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxft-dev \
            libxinerama-dev \
            libnm-glib-dev \
            network-manager-dev \
            libi2c-dev \
            libasound2-dev \
            pkg-config && \
          make clean && \
          make -j\$(nproc)
        "

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pocket-home
        path: build/Release/pocket-home

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: pocket-home
          path: build/Release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          files: build/Release/pocket-home
